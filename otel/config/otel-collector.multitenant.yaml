# Mavvrik OTel Collector — multi-tenant variant
# Mavvrik creds come from incoming OTLP request headers, not env vars.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 33554432
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 10

  resourcedetection:
    detectors: [env, system]
    timeout: 5s

  filter/llm:
    error_mode: ignore
    trace_conditions:
      - >
        span.attributes["gen_ai.system"] == nil and
        span.attributes["gen_ai.provider"] == nil and
        span.attributes["gen_ai.request.model"] == nil and
        span.attributes["gen_ai.response.model"] == nil and
        span.attributes["llm.system"] == nil and
        span.attributes["llm.model_name"] == nil and
        span.attributes["mvk.model_provider"] == nil

connectors:
  forward: {}

exporters:
  otlp_http/mavvrik:
    endpoint: https://ingest.mavvrik.ai
    compression: gzip
    encoding: json
    timeout: 10s
    auth:
      authenticator: headers_setter
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  otlp_http/thirdparty:
    endpoint: ${env:THIRDPARTY_OTLP_ENDPOINT}
    compression: gzip
    timeout: 10s
    headers:
      Authorization: ${env:THIRDPARTY_OTLP_AUTH}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

  headers_setter:
    headers:
      - action: upsert
        key: Authorization
        from_context: authorization
      - action: upsert
        key: X-Tenant-ID
        from_context: x-tenant-id
      - action: upsert
        key: X-Agent-ID
        from_context: x-agent-id

service:
  extensions: [health_check, headers_setter]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection]
      exporters: [forward]

    # Mavvrik leg — applies the LLM-only filter so Mavvrik only sees spans
    # it cares about. Non-LLM spans are NOT dropped from the third-party leg.
    traces/mavvrik:
      receivers: [forward]
      processors: [filter/llm]
      exporters: [otlp_http/mavvrik]

    # Third-party leg — receives ALL spans (LLM + non-LLM).
    traces/thirdparty:
      receivers: [forward]
      exporters: [otlp_http/thirdparty]

  telemetry:
    logs:
      level: ${env:LOG_LEVEL}
      encoding: json
